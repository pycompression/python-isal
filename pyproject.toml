[build-system]
requires = ["setuptools>=77", "setuptools-scm>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "isal"
dynamic = ["version"]
description = """
Faster zlib and gzip compatible compression and decompression by providing \
python bindings for the ISA-L ibrary."""
license="PSF-2.0"
keywords=["isal", "isa-l", "compression", "deflate", "gzip", "igzip"]
authors = [{name = "Leiden University Medical Center"},
           {email = "r.h.p.vorderman@lumc.nl"}]
readme = "README.rst"
requires-python = ">=3.9"  # Because of setuptools version
classifiers = [
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Programming Language :: Python :: Implementation :: CPython",
        "Programming Language :: Python :: Implementation :: PyPy",
        "Programming Language :: C",
        "Development Status :: 5 - Production/Stable",
        "Topic :: System :: Archiving :: Compression",
        "Operating System :: POSIX :: Linux",
        "Operating System :: MacOS",
        "Operating System :: Microsoft :: Windows",
]
urls.homepage = "https://github.com/pycompression/python-isal"
urls.documentation = "https://python-isal.readthedocs.io"

[tool.setuptools_scm]
version_file = "src/isal/_version.py"
# The default template of setuptools-scm 10 without its
# "from __future__ import annotations", which slows down "import isal".
# scm_version.short_node needs setuptools-scm 9.2 or later.
version_file_template = '''
# file generated by setuptools-scm
# don't change, don't track in version control

__all__ = [
    "__version__",
    "__version_tuple__",
    "version",
    "version_tuple",
    "__commit_id__",
    "commit_id",
]

version: str
__version__: str
__version_tuple__: tuple[int | str, ...]
version_tuple: tuple[int | str, ...]
commit_id: str | None
__commit_id__: str | None

__version__ = version = {version!r}
__version_tuple__ = version_tuple = {version_tuple!r}

__commit_id__ = commit_id = {scm_version.short_node!r}
'''

[tool.setuptools.packages.find]
where = ["src"]
include = ["isal"]

[tool.setuptools.package-data]
isal = ['*.pyi', 'py.typed', 'isa-l/LICENSE', 'isa-l/README.md', 'isa-l/Release_notes.txt']
[tool.setuptools.exclude-package-data]
isal = [
        "*.c",
        "*.h",
        "isa-l/*/*",
        "isa-l/Mak*",
        "isa-l/.*",
        "isa-l/autogen.sh",
        "isa-l/Doxyfile",
        "isa-l/CONTRIBUTING.md",
        "isa-l/SECURITY.md",
        "isa-l/configure.ac",
        "isa-l/isa-l.*",
        "isa-l/libisal.pc.in",
        "isa-l/make.inc",
]
